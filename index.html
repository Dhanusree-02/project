<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Safety Checker</title>
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript" src="script.js"></script></head>
<body>
    <div class="container">
        <h1 style="color: rgb(14, 66, 49);">URL VERIFICATION</h1>
        <b><h2 style="color: black;">Enter URL to Check:</h2></b>
        <input id="urlInput" type="text" placeholder="Enter URL">
        <button id="checkBtn" onclick="checkURL()">Check URL</button><br><br>
        <button id="openLinkBtn" onclick="openSafeURL()" style="display: none;">Open Link</button><br><br>
        <button id="tryAnotherBtn" onclick="resetForm()" style="display: none;">Try Another Link</button>
        <p id="result"></p>
    </div>
    <script src="https://fraud-detector.tiiny.site/script.js"></script>


</body></html>
